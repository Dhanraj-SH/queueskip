name: CI

on:
    push:
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-24.04
        env:
            NODE_ENV: test
            PORT: 3000
            MONGO_IMAGE: mongo:7.0.45-jammy
            JWT_ACCESS_SECRET: ci-only-access-secret-change-before-use
            JWT_REFRESH_SECRET: ci-only-refresh-secret-change-before-use
            ADMIN_EMAIL: admin@queueskip.test
            MONGODB_URI: mongodb://127.0.0.1:27017/queueskip?replicaSet=rs0
            MONGODB_TEST_URI: mongodb://127.0.0.1:27017/queueskip_test?replicaSet=rs0
            REDIS_CRITICAL_URL: redis://127.0.0.1:6379
            REDIS_CACHE_URL: redis://127.0.0.1:6380
            SMTP_HOST: localhost
            SMTP_PORT: 1025
            MAIL_FROM: no-reply@queueskip.test
        services:
            redis-critical:
                image: redis:7.4-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
            redis-cache:
                image: redis:7.4-alpine
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4.2.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Start MongoDB replica set
              id: start_mongo
              run: docker compose up --detach --wait --wait-timeout 120 mongo
            - name: Wait for MongoDB primary
              id: wait_mongo_primary
              run: |
                  for attempt in $(seq 1 60); do
                      if docker compose exec --no-TTY mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)" >/dev/null 2>&1; then
                          echo "MongoDB replica set primary is ready"
                          exit 0
                      fi
                      sleep 2
                  done

                  echo "MongoDB replica set did not elect a primary" >&2
                  exit 1
            - name: Show MongoDB logs if startup fails
              if: failure() && (steps.start_mongo.outcome == 'failure' || steps.wait_mongo_primary.outcome == 'failure')
              run: docker compose logs --no-color mongo
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
