name: CI

on:
    push:
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
            PORT: 3000
            JWT_ACCESS_SECRET: ci-only-access-secret-change-before-use
            JWT_REFRESH_SECRET: ci-only-refresh-secret-change-before-use
            MONGODB_URI: mongodb://127.0.0.1:27017/queueskip?replicaSet=rs0
            MONGODB_TEST_URI: mongodb://127.0.0.1:27017/queueskip_test?replicaSet=rs0
            REDIS_CRITICAL_URL: redis://127.0.0.1:6379
            REDIS_CACHE_URL: redis://127.0.0.1:6380
            SMTP_HOST: localhost
            SMTP_PORT: 1025
            MAIL_FROM: no-reply@queueskip.test
        services:
            redis-critical:
                image: redis:7.4-alpine
                ports:
                    - 6379:6379
            redis-cache:
                image: redis:7.4-alpine
                ports:
                    - 6380:6379
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Start MongoDB replica set
              run: |
                  docker run --detach --name queueskip-mongodb --publish 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all

                  for attempt in $(seq 1 30); do
                      if docker exec queueskip-mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then
                          break
                      fi
                      sleep 2
                  done

                  docker exec queueskip-mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"

                  for attempt in $(seq 1 30); do
                      if docker exec queueskip-mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q true; then
                          exit 0
                      fi
                      sleep 2
                  done

                  echo "MongoDB replica set did not become ready" >&2
                  exit 1
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
