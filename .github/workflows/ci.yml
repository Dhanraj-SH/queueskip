name: CI

on:
    push:
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-24.04
        env:
            NODE_ENV: test
            PORT: 3000
            JWT_ACCESS_SECRET: ci-only-access-secret-change-before-use
            JWT_REFRESH_SECRET: ci-only-refresh-secret-change-before-use
            MONGODB_URI: mongodb://127.0.0.1:27017/queueskip?replicaSet=rs0
            MONGODB_TEST_URI: mongodb://127.0.0.1:27017/queueskip_test?replicaSet=rs0
            REDIS_CRITICAL_URL: redis://127.0.0.1:6379
            REDIS_CACHE_URL: redis://127.0.0.1:6380
            SMTP_HOST: localhost
            SMTP_PORT: 1025
            MAIL_FROM: no-reply@queueskip.test
        services:
            redis-critical:
                image: redis:7.4-alpine
                ports:
                    - 6379:6379
            redis-cache:
                image: redis:7.4-alpine
                ports:
                    - 6380:6379
        steps:
            - uses: actions/checkout@v4.2.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Start MongoDB replica set
              id: start_mongo
              run: docker compose up --detach --wait --wait-timeout 120 mongo
            - name: Show MongoDB logs if startup fails
              if: failure() && steps.start_mongo.outcome == 'failure'
              run: docker compose logs --no-color mongo
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
